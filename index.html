<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#863bff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="POS" />
    <!-- Solo para los numeros de precio. El sw los cachea en la primera carga
         (cache-first), asi que despues funciona offline; display=swap evita que
         el texto quede invisible esperando a la fuente.
         Ojo con wght@300 que es lo que usa el build viejo: aca hace falta
         400/500/600/700, porque index.css pone font-synthesis: none y con un
         solo peso el navegador no inventa la negrita, asi que todos los importes
         en bold saldrian finitos. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@400;500;600;700&display=swap"
    />
    <title>Punto de Venta</title>
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem('pos:theme'))
        document.documentElement.dataset.theme =
          stored ??
          (matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light')
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
